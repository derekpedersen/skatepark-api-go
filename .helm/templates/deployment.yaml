apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "skatepark-api.fullname" . }}
  labels:
    {{- include "skatepark-api.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "skatepark-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "skatepark-api.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "skatepark-api.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: IMGUR_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: imgur-api
                  key: imgurClientId
            - name: IMGUR_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: imgur-api
                  key: imgurClientSecret
            - name: IMGUR_REFRESH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: imgur-api
                  key: imgurRefreshToken
            - name: GITHUB_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: admin-auth
                  key: githubOAuthClientId
            - name: GITHUB_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: admin-auth
                  key: githubOAuthClientSecret
            - name: GITHUB_OAUTH_REDIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: admin-auth
                  key: githubOAuthRedirectUrl
            - name: ADMIN_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: admin-auth
                  key: adminSessionSecret
            - name: ADMIN_ALLOWED_GITHUB_USER
              value: {{ .Values.admin.allowedGithubUser | quote }}
            - name: ADMIN_COOKIE_SECURE
              value: {{ .Values.admin.cookieSecure | quote }}
            - name: ADMIN_POST_LOGIN_REDIRECT
              value: {{ .Values.admin.postLoginRedirect | quote }}
            - name: ADMIN_POST_LOGOUT_REDIRECT
              value: {{ .Values.admin.postLogoutRedirect | quote }}
            - name: ADMIN_ALLOWED_REDIRECT_URI
              value: {{ .Values.admin.allowedRedirectUri | quote }}
            - name: SKATEPARKS_FILE
              value: "./repository/json/"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: swagger
              containerPort: 3000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /alive
              port: http
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
